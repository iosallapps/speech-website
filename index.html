<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayloud: Text to Speech</title>
<meta name="description" content="Sayloud reads any text aloud with natural voices, turns speech into text and runs a teleprompter that follows your voice.">
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #111111; --muted: #555555; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d0d0f; --fg: #f2f2f2; --muted: #a0a0a6; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 0 16px; }
  main { max-width: 560px; text-align: center; }
  h1 { font-size: 2.4rem; margin: 0 0 12px; }
  p { color: var(--muted); font-size: 1.1rem; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>Sayloud</h1>
  <p>Text to speech with natural voices, speech to text and a teleprompter that follows your voice. Coming soon to the App Store.</p>
</main>
</body>
</html>
